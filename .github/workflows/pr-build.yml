# PR Build Workflow
name: PR Packages Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel previous runs if a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip if commit message or PR title contains specific patterns to save resources
    if: |
      !contains(github.event.head_commit.message, 'docs:') &&
      !contains(github.event.head_commit.message, 'chore: release') &&
      !contains(github.event.pull_request.title, 'docs:') &&
      !contains(github.event.pull_request.title, 'chore: release') &&
      !startsWith(github.event.pull_request.title, 'v') &&
      !startsWith(github.event.pull_request.title, 'V')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm i --no-frozen-lockfile

      - name: Build packages and docs
        run: pnpm build:docs

      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: echo ${{ github.event.number }} > pr.txt

      - name: Upload PR number
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr
          path: pr.txt

      - name: Upload docs artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/dist

      - name: Comment build generating
        if: github.event_name == 'pull_request'
        uses: actions-cool/maintain-one-comment@v3.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            [<img width="400" src="https://github.com/user-attachments/assets/c25bbbe4-0cf5-4aca-b4b3-db49e7a264d9">](#)
            
            🔨 Building packages...
            <!-- TINY_ROBOT_BUILD -->
          body-include: '<!-- TINY_ROBOT_BUILD -->'
          number: ${{ github.event.number }}

      - name: Publish to pkg.pr.new
        run: |
          npx pkg-pr-new publish \
            ./packages/components \
            ./packages/kit \
            ./packages/svgs \
            --pnpm \
            --comment=update \
            --commentWithSha

      - name: Comment build success
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: actions-cool/maintain-one-comment@v3.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            [<img width="400" src="https://github.com/user-attachments/assets/2a0bb639-dfaf-4384-8d73-cec616ea4b97">](https://preview-${{ github.event.number }}-tiny-robot.surge.sh)
            
            ✅ Preview build completed successfully!
            
            > Click the image above to preview. 
            > Preview will be automatically removed when this PR is closed.  
            <!-- TINY_ROBOT_BUILD -->
          body-include: '<!-- TINY_ROBOT_BUILD -->'
          number: ${{ github.event.number }}

      - name: Comment build failed
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: actions-cool/maintain-one-comment@v3.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            [<img width="400" src="https://github.com/user-attachments/assets/acfe799d-40be-4ffb-8190-da33f84056dc">](#)
            
            ❌ Build failed. Please check the logs for details.
            <!-- TINY_ROBOT_BUILD -->
          body-include: '<!-- TINY_ROBOT_BUILD -->'
          number: ${{ github.event.number }}
