# PR Build Workflow
name: PR Packages Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel previous runs if a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip if commit message or PR title contains specific patterns to save resources
    if: |
      !contains(github.event.head_commit.message, 'docs:') &&
      !contains(github.event.head_commit.message, 'chore: release') &&
      !contains(github.event.pull_request.title, 'docs:') &&
      !contains(github.event.pull_request.title, 'chore: release') &&
      !startsWith(github.event.pull_request.title, 'v') &&
      !startsWith(github.event.pull_request.title, 'V')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm i --no-frozen-lockfile

      - name: Build packages and docs
        run: pnpm build:docs

      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: echo ${{ github.event.number }} > pr.txt

      - name: Upload PR number
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr
          path: pr.txt

      - name: Upload docs artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/dist

      - name: Publish to pkg.pr.new
        run: |
          npx pkg-pr-new publish \
            ./packages/components \
            ./packages/kit \
            ./packages/svgs \
            --pnpm \
            --template \
            --comment=update \
            --packageManager=pnpm
