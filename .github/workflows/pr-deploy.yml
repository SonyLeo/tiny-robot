name: PR Docs Deploy

on:
  workflow_run:
    workflows: ['PR Packages Build']
    types: [completed]

jobs:
  # Deployment job
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    steps:
      - name: Download pr number
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: ${{ github.event.workflow.id }}
          run_id: ${{ github.event.workflow_run.id }}
          name: pr

      - name: Output pr number
        id: pr
        run: echo "id=$(<pr.txt)" >> $GITHUB_OUTPUT

      - name: Download docs artifact
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: ${{ github.event.workflow.id }}
          run_id: ${{ github.event.workflow_run.id }}
          name: docs
          path: dist

      - name: Deploy Site to Surge
        id: deploy
        run: |
          DEPLOY_DOMAIN=preview-${{ steps.pr.outputs.id }}-tiny-robot.surge.sh
          echo "Deploying to: https://$DEPLOY_DOMAIN"
          npx surge --project ./dist --domain $DEPLOY_DOMAIN --token $SURGE_TOKEN
          echo "url=https://$DEPLOY_DOMAIN" >> $GITHUB_OUTPUT
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}

  # Failure handling (Upstream Build Failed)
  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' }}
    steps:
      - name: Download pr number
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: ${{ github.event.workflow.id }}
          run_id: ${{ github.event.workflow_run.id }}
          name: pr
          if_no_artifact_found: ignore

      - name: Output pr number
        id: pr
        run: |
          if [ -f pr.txt ]; then
            echo "id=$(<pr.txt)" >> $GITHUB_OUTPUT
          fi
