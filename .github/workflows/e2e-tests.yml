name: E2E Tests
# 运行时显示的名称
run-name: E2E Tests

on:
  workflow_run:
    workflows: ['PR Packages Build']
    types: [completed]
  push:
    branches: [ develop, main ]

jobs:
  e2e-tests:
    timeout-minutes: 60
    # 指定运行环境为最新版本的ubuntu
    runs-on: ubuntu-latest
    # 只在构建成功或 push 事件时运行
    if: |
      github.event_name == 'push' || 
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request')
    
    steps:
      # 下载 PR number (仅 PR 触发时)
      - name: Download PR number
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: ${{ github.event.workflow.id }}
          run_id: ${{ github.event.workflow_run.id }}
          name: pr
          if_no_artifact_found: ignore

      - name: Get PR number
        if: github.event_name == 'workflow_run'
        id: pr
        run: |
          if [ -f pr.txt ]; then
            echo "number=$(<pr.txt)" >> $GITHUB_OUTPUT
          fi

      # 步骤1: 检出代码 (处理所有情况)

      # 场景 A: 当工作流由 push 事件触发时 (例如合并到 develop 分支)
      # 或者由仓库内部成员创建的 PR 触发时，执行此步骤。
      - name: Checkout for Develop Repo Push or PR
        # 条件：事件不是来自 fork 的 PR
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      # 场景 B: 当工作流由 workflow_run 触发时
      - name: Checkout for Workflow Run
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 步骤2: 设置pnpm包管理器
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 步骤3: 设置Node.js环境
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 使用Node.js 20版本
          registry-url: 'https://registry.npmjs.org' # 设置npm registry地址

      # 步骤4: 获取pnpm缓存目录路径
      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      # 步骤5: 配置pnpm缓存
      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          # 使用操作系统类型和pnpm-lock.yaml的哈希值作为缓存键
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 步骤6: 安装项目依赖
      - name: Install dependencies
        run: pnpm i --no-frozen-lockfile

      # 步骤6.5: 下载构建产物 (仅 PR 触发时)
      - name: Download build artifacts
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: ${{ github.event.workflow.id }}
          run_id: ${{ github.event.workflow_run.id }}
          name: build
          path: packages
          if_no_artifact_found: ignore

      # 步骤7: 构建组件 (仅 push 事件时)
      - name: Run Build Components
        if: github.event_name == 'push'
        run: pnpm build

      # 步骤8: 安装 Playwright 浏览器
      - name: Install Playwright Browser
        run: |
          cd packages/test
          npx playwright install --with-deps chromium

      # 步骤9: 运行 E2E 测试
      - name: Run Playwright Tests
        run: pnpm test

      # 步骤10: 上传 Playwright 测试报告
      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/test/playwright-report/
          retention-days: 13