name: E2E Tests
# 运行时显示的名称
run-name: E2E Tests

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

# 避免同一 PR 的多次提交同时运行测试
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    timeout-minutes: 60
    # 指定运行环境为最新版本的ubuntu
    runs-on: ubuntu-latest
    # Skip if commit message or PR title contains specific patterns to save resources
    if: |
      !contains(github.event.head_commit.message, 'docs:') &&
      !contains(github.event.head_commit.message, 'chore: release') &&
      !contains(github.event.pull_request.title, 'docs:') &&
      !contains(github.event.pull_request.title, 'chore: release') &&
      !startsWith(github.event.pull_request.title, 'v') &&
      !startsWith(github.event.pull_request.title, 'V')
    
    steps:
      # 步骤1: 检出代码 (处理所有情况)

      # 场景 A: 当工作流由 push 事件触发时 (例如合并到 develop 分支)
      # 或者由仓库内部成员创建的 PR 触发时，执行此步骤。
      - name: Checkout for Develop Repo Push or PR
        # 条件：事件不是来自 fork 的 PR
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          # 对于源仓库 PR，确认检出最新的代码
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # 场景 B: 当工作流由外部 fork 仓库的 PR 触发时，执行此步骤
      - name: Checkout for Fork PR
        # 条件：事件是来自 fork 的 PR
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}

      # 步骤2: 设置pnpm包管理器
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 步骤3: 设置Node.js环境
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 使用Node.js 20版本
          registry-url: 'https://registry.npmjs.org' # 设置npm registry地址

      # 步骤4: 获取pnpm缓存目录路径
      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      # 步骤5: 配置pnpm缓存
      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          # 使用操作系统类型和pnpm-lock.yaml的哈希值作为缓存键
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 步骤6: 安装项目依赖
      - name: Install dependencies
        run: pnpm i --no-frozen-lockfile

      # 步骤6.5: 尝试下载构建产物 (仅 PR 触发时，来自同一工作流运行)
      - name: Download build artifacts from PR Build
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v9
        continue-on-error: true
        id: download-artifact
        with:
          workflow: pr-build.yml
          pr: ${{ github.event.pull_request.number }}
          name: build
          path: packages
          if_no_artifact_found: ignore

      # 步骤7: 构建组件 (仅在 push 事件或下载产物失败时)
      - name: Run Build Components
        if: github.event_name == 'push' || steps.download-artifact.outcome == 'failure'
        run: pnpm build

      # 步骤8: 安装 Playwright 浏览器
      - name: Install Playwright Browser
        run: |
          cd packages/test
          npx playwright install --with-deps chromium

      # 步骤9: 运行 E2E 测试
      - name: Run Playwright Tests
        run: pnpm test

      # 步骤10: 上传 Playwright 测试报告
      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/test/playwright-report/
          retention-days: 13